version: "3"
services:
  db:
    image: postgres:10
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: social_network
    ports:
      - "5432:5432"

  backend:
    image: backend:v1
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    image: frontend:v1
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend