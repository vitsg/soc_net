version: "3"
services:
  db:
    image: postgres:10
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: social_network
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: backend:v2
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    image: frontend:v2
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data: